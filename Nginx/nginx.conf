upstream frontend_servis {
    server frontend:80;
}

upstream backend_servis {
    server backend:8080;
}

server {
    listen 80;

    location /api/ {
        proxy_pass http://backend_servis;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend_servis;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
