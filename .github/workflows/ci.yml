name: CI

on:
  push:
    branches: [devops]
  pull_request:
    branches: [devops]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Format kontrolü
        run: dotnet format --verify-no-changes
        working-directory: Backend

      - name: Build
        run: dotnet build
        working-directory: Backend

      - name: Test
        run: dotnet test
        working-directory: Backend.Tests

  fastapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: FastApi/requirements-dev.txt

      - name: Bağımlılıkları kur
        run: pip install -r requirements-dev.txt
        working-directory: FastApi

      - name: Lint
        run: ruff check .
        working-directory: FastApi

      - name: Test
        run: pytest -v
        working-directory: FastApi

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci
        working-directory: Frontend

      - name: Lint
        run: npm run lint
        working-directory: Frontend

      - name: Test
        run: npm test
        working-directory: Frontend

      - name: Build
        run: npm run build
        working-directory: Frontend

  backend-image:
    needs: backend
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: |
            ghcr.io/mrtoncl/devops-backend:latest
            ghcr.io/mrtoncl/devops-backend:${{ github.sha }}

  fastapi-image:
    needs: fastapi
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./FastApi
          push: true
          tags: |
            ghcr.io/mrtoncl/devops-fastapi:latest
            ghcr.io/mrtoncl/devops-fastapi:${{ github.sha }}

  frontend-image:
    needs: frontend
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          push: true
          tags: |
            ghcr.io/mrtoncl/devops-frontend:latest
            ghcr.io/mrtoncl/devops-frontend:${{ github.sha }}
  e2e:
    needs: [backend, fastapi, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .env dosyasını oluştur (CI'a özel, secret içermiyor)
        run: |
          cat <<EOF > .env
          POSTGRES_DB=postgres
          POSTGRES_USER=postgres
          DB_CONNECTION_STRING=Host=postgres;Database=postgres;Username=postgres;Password=
          FASTAPI_URL=http://fastapi:8000
          EOF

      - name: Stack'i ayağa kaldır
        run: docker compose up --build -d

      - name: Servislerin hazır olmasını bekle
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost && curl -sf http://localhost/api/parts && break
            echo "Bekleniyor... ($i)"
            sleep 3
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Playwright'ı kur
        run: npm ci && npx playwright install --with-deps
        working-directory: Frontend

      - name: E2E testlerini çalıştır
        run: npx playwright test
        working-directory: Frontend

      - name: Test raporunu sakla (başarısız olursa da)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Frontend/playwright-report/

      - name: Stack'i kapat
        if: always()
        run: docker compose down          