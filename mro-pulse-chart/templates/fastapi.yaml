apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mro-pulse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.fastapi.replicaCount }}
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: fastapi
          image: "{{ .Values.fastapi.image }}:{{ .Values.fastapi.tag }}"
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ .Values.fastapi.resources.requests.cpu }}
              memory: {{ .Values.fastapi.resources.requests.memory }}
            limits:
              cpu: {{ .Values.fastapi.resources.limits.cpu }}
              memory: {{ .Values.fastapi.resources.limits.memory }}
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: fastapi
  ports:
    - port: 8000
      targetPort: 8000